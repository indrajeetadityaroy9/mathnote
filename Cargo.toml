[package]
name = "mathnote"
version = "0.1.0"
edition = "2024"
description = "A local-first terminal notebook for natural-language mathematics and LaTeX"
license = "MIT"

[dependencies]
base64 = "0.22"
color-eyre = "0.6"
crossterm = "0.29"
directories = "6.0"
flate2 = "1"
image = { version = "0.25", default-features = false }
kurbo = "0.13"
nix = { version = "0.31", features = ["socket", "process", "signal", "uio", "fs", "poll"] }
ratatui = "0.30"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
ropey = "1.6.1"
skrifa = "0.42.1"
tectonic_bridge_core = "0.5.3"
tectonic_bundles = { version = "0.4.2", default-features = false, features = ["geturl-curl"] }
tectonic_engine_xetex = "0.5.3"
tectonic_errors = "0.3.0"
tectonic_io_base = "0.6.0"
tectonic_status_base = "0.2.2"
unicode-width = "0.2"
vello_cpu = { version = "0.0.8", default-features = false, features = ["std", "u8_pipeline"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
hayro = "0.7.1"
# Only for the renderer-vs-PDF agreement tests: Tectonic's full pipeline makes the reference PDFs.
tectonic = { version = "0.17.0", default-features = false, features = ["geturl-curl"] }


[[bench]]
name = "latency"
harness = false
